name: Daily Report

on:
  schedule:
    - cron: '0 6,18 * * *'
  workflow_dispatch:
    inputs:
      period:
        description: '"morning" or "evening" (leave empty for auto-detect by time)'
        required: false
        default: ''
        type: string

permissions:
  contents: read

jobs:
  daily_report:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run daily report
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
        run: |
          PERIOD="${{ github.event.inputs.period }}"
          if [ -n "$PERIOD" ]; then
            python daily_report.py "$PERIOD"
          else
            python daily_report.py
          fi
